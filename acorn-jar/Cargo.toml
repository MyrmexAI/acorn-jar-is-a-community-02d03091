[package]
name = "acorn-jar"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "0.9"
pinocchio-system = "0.3"
pinocchio-token = "0.4"
pinocchio-pubkey = "0.3"

[dev-dependencies]
litesvm = "0.7"
solana-account = "2.2"
solana-instruction = "2.3"
solana-keypair = "2.2"
solana-message = "2.4"
solana-pubkey = "2.4"
solana-signer = "2.2"
solana-system-interface = { version = "1.0", features = ["bincode"] }
solana-transaction = "2.2"
solana-transaction-error = "2.2"
